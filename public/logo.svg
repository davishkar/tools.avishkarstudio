  <text x="20" y="25" text-anchor="middle" fill="#FFFFFF" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="800" letter-spacing="-0.04em">360°</text>
  
  <!-- Brand Text -->
  <text x="48" y="22" fill="#0F172A" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="800" letter-spacing="-0.02em">360° Tools</text>
